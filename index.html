<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/e0b303a9da.js" crossorigin="anonymous"></script>
  <title>Bubble Animation Navbar</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">CodewithAbhi</div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="content">
    <h1>Login</h1>
    <div class="input-container">
      <i class="fa-solid fa-user" aria-hidden="true"></i>
      <input type="text" placeholder="User Id" aria-label="User ID">
    </div>
    <div class="input-container">
      <i class="fa-solid fa-lock" aria-hidden="true"></i>
      <input type="password" placeholder="Password" aria-label="Password">
    </div>
    <button type="button">Login</button>
  </div>

  <div class="bubble-container"></div>

  <script src="script.js"></script>
</body>
</html>
